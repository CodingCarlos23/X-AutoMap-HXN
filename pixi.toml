[workspace]
channels = ["conda-forge"]
name = "Beamline workflow"
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "<3.13"
tiled-client = ">=0.2.3"
ipython = ">=9.10.0,<10"
numpy = ">=2.4.2,<2.5"
opencv = ">=4.13,<5"
scikit-image = ">=0.26.0,<0.27"
hxntools = ">=0.6.5,<0.7"
qtpy = ">=2.4.3,<3"
pyside6 = ">=6.8,<7"
bluesky-queueserver = ">=0.0.24,<0.0.25"
bluesky-queueserver-api = ">=0.0.13,<0.0.14"
cellpose = ">=4.0.8,<5"
stardist = ">=0.9.2,<1"
tensorflow = ">=2.19,<2.20"
matplotlib-inline = ">=0.2.1,<0.3"
ipympl = ">=0.10.0,<0.11"
pytorch = "2.7.*"
torchvision = "0.22.*"

[pypi-dependencies]
automap_hxn = { path = ".", editable = true }
ultralytics = ">=8.4,<9"
